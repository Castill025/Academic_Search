<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Fraunces:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="prueba.css">
  <link rel="stylesheet" href="Dhistorial.css">
  <title>Historial · Academic Search</title>
</head>
<body>
  <header class="header">
    <a class="marca" href="index.html">
      <span class="marca-medallon"><img src="mascota.png" alt=""></span>
      <b class="marca-nombre">Academic <span>Search</span></b>
    </a>
    <nav class="menu" aria-label="Principal">
      <div id="navlinks">
        <a href="index.html">Inicio</a>
        <a href="historial.html" aria-current="page">Historial</a>
        <a href="acerca.html">Acerca de</a>
        <a href="contacto.html">Contacto</a>
      </div>
    </nav>
  </header>

  <main class="hist">
    <h1>Tu <em>historial</em> de búsqueda</h1>
    <p class="hist-sub" id="hCuenta"></p>

    <div class="hist-filtros" id="hFiltros">
      <button class="activo" data-f="Todos">Todos</button>
      <button data-f="Colegio">Colegio</button>
      <button data-f="Universidad">Universidad</button>
    </div>

    <div class="hist-lista" id="hLista"></div>

    <div class="hist-vacio" id="hVacio" hidden>
      <img src="mascota.png" alt="">
      <h2>Aún no hay caminos por aquí</h2>
      <p>Cuando explores un área y llegues a los resultados, tu camino se guardará aquí.</p>
      <a class="comenzar" href="index.html">Empezar a explorar</a>
    </div>

    <div class="hist-borrar"><button id="hBorrar" type="button">🗑 Borrar historial</button></div>
  </main>

  <!-- aquí pega el mismo <footer id="footer"> ... </footer> de tu index.html -->

  <script src="historial.js"></script>

</html>
