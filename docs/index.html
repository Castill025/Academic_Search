<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="prueba.css">
    <title>Buscador Academico con arbol de decisiones</title>
</head>
<body>
    <header class="barra">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">

        <nav id="navbar">
          <div id="navlogo">Academic Search</div>
          <div id="navlinks">
            <a href="historial.html" id="historialBtn">Historial</a>
            <a href="contacto.html" id="contactoBtn">Contacto</a>
          </div>

          <a href="index.html" class="marca">
            <img src="logo-completo.png" alt="Academic Search" class="marca_img">
          </a>
        </nav> 
    </header>

    <div class="fondo" aria-hidden="true">
      <div class="Circ-V"></div>
      <div class="Circ-L"></div>
      <div class="Circ-A"></div>

   <main class="contenido">
      <section class="hero">
        <div class="hero-txt">
          <h1>¿Qué quieres <em>aprender</em> hoy?</h1>
           <p class="sub">Elige un área y te llevo, paso a paso, hasta el tema que buscas.</p>
        </div>

      <button id="comenzarBtn">Comenzar</button>

      <div id="contenidoArbol">
        <button id="retro" style="display:none">Atrás</button>
        <div id="arbolVisual"></div>
        <div id="pregunta"></div>
        <div id="opc"></div>
      </div>

       <div class="hero-mas">
         <span class="nube"></span>
         <img src="mascota.png" alt="Arbolito con lentes">
        </div>
      </section>

      <div class="paisaje" aria-hidden="true">
        <svg viewBox="0 0 1360 180" preserveAspectRatio="none" width="100%" height="180">
          <path d="M0 120 C200 60 400 100 680 90 C960 80 1160 40 1360 70 L1360 180 L0 180 Z" fill="#C9EFD6"/>
          <path d="M0 150 C250 100 500 140 700 130 C950 120 1150 90 1360 110 L1360 180 L0 180 Z" fill="#9BE3B4"/>
          <path d="M0 170 C300 140 550 165 750 160 C1000 155 1200 135 1360 145 L1360 180 L0 180 Z" fill="#7FD6A0"/>
        </svg>
      </div>

      <footer id="footer">
        <div class="f-inicio">
          <div class="f-marca">…logo y frase…</div>
          <nav class="f-cols">

           <div>
           <h4>Explorar</h4>
           <a href="index.html">Inicio</a>
           <p>© 2026 Academic Search — Buscador Académico</p>
           </div>
           <div>
             <h4>Ayuda</h4>
             <a href="contacto.html">Contacto</a>
            </div>
          </nav>
        </div>
        <div class="f-fin">
          <p>© 2026 Academic Search — Buscador Académico</p>
        </div>
      </footer>
    
      <script src="arbolMateCol.js"></script>
      <script src="arbolCiencias.js"></script>
      <script src="arbolCyL.js"></script>
      <script src="arbolMateU.js"></script>
      <script src="arbolInform.js"></script>
      <script src="arbolAdmin.js"></script>
